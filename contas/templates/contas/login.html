{% extends "contas/base.html" %}
{% block titulo %}Login{% endblock %}
{% block cabecalho %}Entrar{% endblock %}
{% block conteudo %}
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="id_username">Usuário</label>
            {{ form.username }}
        </div>
        <div>
            <label for="id_password">Senha</label>
            {{ form.password }}
        </div>
        {% if form.errors %}
            <div class="msg error">Usuário ou senha inválidos.</div>
        {% endif %}
        <button type="submit">Entrar</button>
    </form>

    <a href="{% url 'cadastro' %}">Criar usuário e conta</a>
{% endblock %}
